services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"   # 5433 on host — local Homebrew Postgres owns 5432
    environment:
      POSTGRES_USER: hackos
      POSTGRES_PASSWORD: hackos
      POSTGRES_DB: hackos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackos"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: hackos
      MINIO_ROOT_PASSWORD: hackos123
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
